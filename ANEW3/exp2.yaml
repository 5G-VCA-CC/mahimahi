output_dir: ./runs

secs_per_run: 30
num_runs: 1

traces:
  up: /path/to/uplink.trace
  down: /path/to/downlink.trace

mahimahi:
  delay_ms: 0
  link_delay_ms: 0

queue:
  type: droptail
  packets: 250
  target: 15ms
  tupdate: 16ms
  alpha: 0.16
  beta: 3.2

flows:
  base_port: 5300

  classic:
    proto: tcp        # tcp or udp (or omit/empty to disable)
    tos: 0x00
    cc: cubic         # only used if proto=tcp
    rate: 12mbit      # only used if proto=udp
    packet_len: 1200  # only used if proto=udp

  l4s:
    tos: 0x02         # set/omit to enable/disable L4S flow
    cc: prague
