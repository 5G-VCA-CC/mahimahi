# exp.yaml

output_dir: ./outputs

secs_per_run: 30
num_runs: 40

# cpu shielding
housekeeping: "0-3"
experiment_cpus: "4-7"

cores:
  mahi_core: 7
  server_core: 5
  client_core: 6

traces:
  up: ../traces/Constant.up
  down: ../traces/Constant.down

queue:
  type: dualPI2
  packets: 200
  target: 1
  tupdate: 16
  alpha: 0.16
  beta: 3

flow:
  mode: l4s # l4s OR classic
  l4s_tos: 1 # defaults to 1 if omitted, change this to 0 for classic
  rate: "12M"
  packet_len: 1200
  base_port: 5300
